name: secret scan

on:
  push:
  pull_request:
  schedule:
    # weekly, so a leak introduced by a later commit still gets caught
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # scan full history, not just the tip
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  repo-scanner:
    name: repo scanner (PII + secrets)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run scan-secrets.ps1
        shell: pwsh
        run: pwsh -NoProfile -File scripts/scan-secrets.ps1
